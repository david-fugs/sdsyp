<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cascadas AJAX</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Prueba de Cascadas AJAX</h1>
    
    <div style="margin: 20px;">
        <label>Meta:</label>
        <select id="meta" style="width: 300px; padding: 5px;">
            <option value="">Seleccione Meta...</option>
            <option value="1">Meta 1</option>
            <option value="2">Meta 2</option>
            <option value="3">Meta 3</option>
            <option value="4">Meta 4</option>
            <option value="5">Meta 5</option>
            <option value="6">Meta 6</option>
        </select>
    </div>

    <div style="margin: 20px;">
        <label>Actividad:</label>
        <select id="actividad" style="width: 300px; padding: 5px;" disabled>
            <option value="">Primero seleccione una meta</option>
        </select>
    </div>

    <div style="margin: 20px;">
        <label>Acción:</label>
        <select id="accion" style="width: 300px; padding: 5px;" disabled>
            <option value="">Primero seleccione una actividad</option>
        </select>
    </div>

    <div style="margin: 20px;">
        <label>Política Pública:</label>
        <select id="politica-publica" style="width: 300px; padding: 5px;">
            <option value="">Seleccione Política Pública...</option>
        </select>
    </div>

    <div id="console" style="margin: 20px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; min-height: 200px;">
        <h3>Consola de Debug:</h3>
    </div>

    <script>
        function log(message) {
            console.log(message);
            $('#console').append('<div>' + new Date().toLocaleTimeString() + ': ' + JSON.stringify(message) + '</div>');
        }

        $(document).ready(function() {
            log('Página cargada');

            $('#meta').on('change', function() {
                const idMeta = $(this).val();
                log('Meta seleccionada: ' + idMeta);

                $('#actividad').empty().append('<option value="">Seleccione Actividad...</option>').prop('disabled', true);
                $('#accion').empty().append('<option value="">Seleccione Acción...</option>').prop('disabled', true);
                $('#politica-publica').empty().append('<option value="">Seleccione Política Pública...</option>');

                if (idMeta) {
                    log('Iniciando AJAX a getActividades.php');
                    $.ajax({
                        url: 'getActividades.php',
                        type: 'POST',
                        data: { id_meta: idMeta },
                        success: function(response) {
                            log('Respuesta recibida de actividades:');
                            log(response);
                            if (response && response.trim() !== '') {
                                $('#actividad').html('<option value="">Seleccione Actividad...</option>' + response).prop('disabled', false);
                                log('Actividades cargadas exitosamente');
                            } else {
                                $('#actividad').html('<option value="">No hay actividades</option>');
                                log('No hay actividades disponibles');
                            }
                        },
                        error: function(xhr, status, error) {
                            log('ERROR en AJAX actividades:');
                            log('Status: ' + status);
                            log('Error: ' + error);
                            log('Response: ' + xhr.responseText);
                            Swal.fire('Error', 'Error al cargar actividades: ' + error, 'error');
                        }
                    });
                }
            });

            $('#actividad').on('change', function() {
                const idActividad = $(this).val();
                log('Actividad seleccionada: ' + idActividad);
                
                $('#accion').empty().append('<option value="">Seleccione Acción...</option>').prop('disabled', true);
                $('#politica-publica').empty().append('<option value="">Seleccione Política Pública...</option>');

                if (idActividad) {
                    log('Iniciando AJAX a getAcciones.php');
                    $.ajax({
                        url: 'getAcciones.php',
                        type: 'POST',
                        data: { id_actividad: idActividad },
                        success: function(response) {
                            log('Respuesta recibida de acciones:');
                            log(response);
                            if (response && response.trim() !== '') {
                                $('#accion').html('<option value="">Seleccione Acción...</option>' + response).prop('disabled', false);
                                log('Acciones cargadas exitosamente');
                            } else {
                                $('#accion').html('<option value="">No hay acciones</option>');
                                log('No hay acciones disponibles');
                            }
                        },
                        error: function(xhr, status, error) {
                            log('ERROR en AJAX acciones:');
                            log('Status: ' + status);
                            log('Error: ' + error);
                            log('Response: ' + xhr.responseText);
                            Swal.fire('Error', 'Error al cargar acciones: ' + error, 'error');
                        }
                    });
                }
            });

            $('#accion').on('change', function() {
                const idAccion = $(this).val();
                log('Acción seleccionada: ' + idAccion);
                
                $('#politica-publica').empty().append('<option value="">Seleccione Política Pública...</option>');

                if (idAccion) {
                    log('Iniciando AJAX a getPoliticaPublica.php');
                    $.ajax({
                        url: 'getPoliticaPublica.php',
                        type: 'POST',
                        data: { id_accion: idAccion },
                        dataType: 'json',
                        success: function(response) {
                            log('Respuesta recibida de políticas:');
                            log(response);
                            if (response && response.politicas && response.politicas.length > 0) {
                                response.politicas.forEach(function(p) {
                                    $('#politica-publica').append('<option value="' + p.id_politica + '">' + p.descripcion_politica + '</option>');
                                });
                                log('Políticas cargadas exitosamente');
                            } else {
                                $('#politica-publica').append('<option value="">No hay políticas</option>');
                                log('No hay políticas disponibles');
                            }
                        },
                        error: function(xhr, status, error) {
                            log('ERROR en AJAX políticas:');
                            log('Status: ' + status);
                            log('Error: ' + error);
                            log('Response: ' + xhr.responseText);
                            $('#politica-publica').append('<option value="">Error al consultar</option>');
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
